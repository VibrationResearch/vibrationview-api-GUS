name: Release MSI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -n "$PREVIOUS_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD -- ':!CHANGELOG.md')
          else
            LOG=$(git log --pretty=format:"- %s" -- ':!CHANGELOG.md')
          fi
          ENTRY="## [$VERSION] - $DATE"$'\n'"$LOG"
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(cat CHANGELOG.md)
            printf '%s\n\n%s\n' "$ENTRY" "$EXISTING" > CHANGELOG.md
          else
            printf '# Changelog\n\n%s\n' "$ENTRY" > CHANGELOG.md
          fi

      - name: Commit and push changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "update CHANGELOG.md for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibrationVIEW_Gus-${{ steps.version.outputs.version }}-MSI
          path: SetupVibrationVIEW_Gus/bin/Release/VibrationVIEW_Gus.msi
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: SetupVibrationVIEW_Gus/bin/Release/VibrationVIEW_Gus.msi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
